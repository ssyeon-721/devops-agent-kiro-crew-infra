name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-northeast-2"
  ECR_REPO: ${{ secrets.ECR_REPO }}   # e.g. 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/poc-eks-incident-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 및 푸시
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPO:$IMAGE_TAG -t $ECR_REPO:latest .
          docker push $ECR_REPO:$IMAGE_TAG
          # main 브랜치일 때만 latest 태그 푸시
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push $ECR_REPO:latest
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 빌드 요약
        run: |
          echo "## 빌드 결과" >> $GITHUB_STEP_SUMMARY
          echo "- 커밋: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 이미지: \`${{ env.ECR_REPO }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 브랜치: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
